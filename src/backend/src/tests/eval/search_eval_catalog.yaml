items:
- id: product::pos-transaction-stream
  type: data-product
  feature_id: data-products
  title: POS Transaction Stream
  description: Provide real-time point-of-sale transaction data from store systems for downstream analytics and operational
    use cases. Consume this stream for real-time fraud detection, inventory tracking, or as a foundation for prepared analytics
    datasets.
  extra_data:
    status: active
    owner: Data Engineering Team
- id: product::prepared-sales-transactions
  type: data-product
  feature_id: data-products
  title: Prepared Sales Transactions
  description: Provide cleaned, validated, and standardized sales transaction data ready for analytics consumption. Use for
    BI reporting, demand forecasting, customer analytics, and other downstream analytical use cases.
  extra_data:
    status: active
    owner: Data Engineering Team
- id: product::demand-forecast-model-output
  type: data-product
  feature_id: data-products
  title: Demand Forecast Model Output
  description: Provide predicted demand for products at various locations based on historical sales and external factors.
    Use for inventory planning, supply chain optimization, and promotional planning.
  extra_data:
    status: active
    owner: Analytics Team
- id: product::inventory-optimization-recommendations
  type: data-product
  feature_id: data-products
  title: Inventory Optimization Recommendations
  description: Provide automated inventory reordering recommendations based on demand forecasts and current stock levels.
    API consumed by inventory management system to trigger automated reorders.
  extra_data:
    status: active
    owner: Data Engineering Team
- id: product::price-optimization-model-output
  type: data-product
  feature_id: data-products
  title: Price Optimization Model Output
  description: Provide data-driven pricing recommendations based on demand elasticity and competitive positioning. Review
    recommendations weekly and apply to pricing systems via bulk import.
  extra_data:
    status: active
    owner: Analytics Team
- id: product::customer-marketing-recommendations
  type: data-product
  feature_id: data-products
  title: Customer Marketing Recommendations
  description: Provide targeted customer segments and personalized product recommendations for marketing campaigns. Export
    customer lists weekly for email campaigns. Use real-time API for website personalization.
  extra_data:
    status: active
    owner: Data Governance Team
- id: product::retail-performance-dashboard-data
  type: data-product
  feature_id: data-products
  title: Retail Performance Dashboard Data
  description: Provide aggregated, denormalized data optimized for executive-level retail performance dashboards. Connect
    BI tools directly via provided connection string. Data refreshes nightly at 2 AM EST.
  extra_data:
    status: active
    owner: Analytics Team
- id: contract::customer-data-contract
  type: data-contract
  feature_id: data-contracts
  title: Customer Data Contract
  description: Core customer data contract defining customer profile, preferences, and transaction history Customer master
    data to power user-facing apps, analytics, and marketing campaigns
  extra_data:
    status: active
    owner: Data Engineering Team
- id: contract::product-catalog-contract
  type: data-contract
  feature_id: data-contracts
  title: Product Catalog Contract
  description: Complete product catalog with categories, inventory, pricing, and vendor information Power e-commerce platform,
    merchandising experiences, and inventory management
  extra_data:
    status: deprecated
    owner: Analytics Team
- id: contract::data-sharing-agreement
  type: data-contract
  feature_id: data-contracts
  title: Data Sharing Agreement
  description: Legal agreement for data sharing between Analytics and Marketing Enables sharing of aggregated analytics for
    campaign optimization
  extra_data:
    status: active
    owner: Data Governance Team
- id: contract::iot-device-data-contract
  type: data-contract
  feature_id: data-contracts
  title: IoT Device Data Contract
  description: Comprehensive IoT device management and telemetry data for smart building systems Monitor device health, performance,
    and environmental data in near real-time for predictive maintenance and energy optimization
  extra_data:
    status: active
    owner: Data Science Team
- id: contract::iot-sensor-data-contract
  type: data-contract
  feature_id: data-contracts
  title: IoT Sensor Data Contract
  description: Real-time IoT sensor data from manufacturing floor Stream analytics and anomaly detection
  extra_data:
    status: retired
    owner: Data Science Team
- id: contract::financial-transactions-contract
  type: data-contract
  feature_id: data-contracts
  title: Financial Transactions Contract
  description: Daily financial transaction data Reconciliation, accounting, and reporting
  extra_data:
    status: draft
    owner: Data Governance Team
- id: contract::inventory-management-contract
  type: data-contract
  feature_id: data-contracts
  title: Inventory Management Contract
  description: Real-time inventory levels and movements Track stock levels across warehouses
  extra_data:
    status: deprecated
    owner: Analytics Team
