command: ['python', 'backend/src/app.py']

env:
  - name: "ENV"
    value: "PROD"
  - name: "APP_DEMO_MODE"
    value: "false"
  - name: "APP_DB_DROP_ON_START"
    value: "false"

  - name: "PYTHONPATH"
    value: "./backend:${PYTHONPATH}"
  - name: "PYTHONUNBUFFERED"
    value: "1"
  - name: "FRONTEND_STATIC_DIR"
    value: "./static"

  # Lakebase PostgreSQL connection (POSTGRES_* names are what the app reads)
  - name: "POSTGRES_HOST"
    value: "ep-blue-morning-d6a688oy.database.ap-southeast-2.cloud.databricks.com"
  - name: "POSTGRES_PORT"
    value: "5432"
  - name: "POSTGRES_DB"
    value: "app_ontos"
  - name: "POSTGRES_DB_SCHEMA"
    value: "public"
  # POSTGRES_USER is intentionally omitted - auto-detected from service principal at runtime

  - name: "DATABRICKS_WAREHOUSE_ID"
    value: "c683eb455ef5136f"

  - name: "APP_ADMIN_DEFAULT_GROUPS"
    value: '["admins"]'
  - name: "APP_AUDIT_LOG_DIR"
    value: "audit_logs"

  - name: "LLM_ENABLED"
    value: "False"

  # Tell the build script to use the pre-built frontend assets (avoids npm at deploy time)
  - name: "SKIP_FRONTEND_BUILD"
    value: "1"